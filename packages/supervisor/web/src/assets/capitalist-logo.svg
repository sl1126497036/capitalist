    <path d="M293 1186Q213 1186 162.0 1233.5Q111 1281 111 1350Q111 1421 162.0 1466.0Q213 1511 293 1511Q374 1511 424.5 1466.0Q475 1421 475 1350Q475 1278 424.5 1232.0Q374 1186 293 1186ZM449 0H133V1024H449Z" transform="translate(5435.0,0)"/>
