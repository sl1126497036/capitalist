<svg xmlns="http://www.w3.org/2000/svg" viewBox="204 457 617 210" width="617" height="210">
  <title>Capitalist</title>
  <defs>
    <filter id="softglint" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <filter id="glintSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <clipPath id="lens">
      <circle cx="272" cy="549" r="29"/>
    </clipPath>
  </defs>

  <g transform="translate(0,-24)" fill="#2D343A">
    <!-- 镜片 -->
    <g clip-path="url(#lens)">
      <!-- 底色恒定不动，反光才看得出来 -->
      <rect x="226" y="503" width="92" height="92" fill="#DBD9D3"/>
      <!-- 基础玻璃质感：恒定的贴弧弱反光 -->
      <path d="M 246.63 539.77 A 27 27 0 0 1 262.77 523.63 L 263.62 525.98 A 24.5 24.5 0 0 0 248.98 540.62 Z"
            fill="#FFFFFF" opacity="0.10" filter="url(#softglint)"/>
      <path d="M 295.11 559.78 A 25.5 25.5 0 0 1 284.75 571.08 L 283.00 568.05 A 22 22 0 0 0 291.94 558.30 Z"
            fill="#FFFFFF" opacity="0.12" filter="url(#softglint)"/>
      <!-- 扫光：两道 45° 斜向光带从左上往右下刷过 -->
      <g filter="url(#glintSoft)">
        <animateTransform attributeName="transform" type="translate"
          values="-48 -48; -48 -48; 51 51; 51 51"
          keyTimes="0;0.5;0.93;1" calcMode="spline"
          keySplines="0 0 1 1;0.3 0 0.3 1;0 0 1 1"
          dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;0;0"
                 keyTimes="0;0.5;0.56;0.87;0.93;1"
                 dur="2.4s" repeatCount="indefinite"/>
        <g transform="rotate(45 272 549)">
          <!-- 主光带 -->
          <rect x="265" y="499" width="14" height="100" fill="#FFFFFF" opacity="0.9"/>
          <!-- 伴光带：右下侧一道细光 -->
          <rect x="285" y="499" width="6" height="100" fill="#FFFFFF" opacity="0.5"/>
        </g>
      </g>
    </g>

    <!-- 圆环 C -->
    <path d="M 310.14 574.72 A 46 46 0 1 1 310.14 523.28 L 296.04 532.78 A 29 29 0 1 0 296.04 565.22 Z"/>

    <!-- 链条 -->
    <g fill="none" stroke="#2D343A" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate"
        values="0.00 303.09 569.97; 2.50 303.09 569.97; 4.33 303.09 569.97; 5.00 303.09 569.97; 4.33 303.09 569.97; 2.50 303.09 569.97; 0.00 303.09 569.97; -2.50 303.09 569.97; -4.33 303.09 569.97; -5.00 303.09 569.97; -4.33 303.09 569.97; -2.50 303.09 569.97; -0.00 303.09 569.97" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" dur="2.4s" repeatCount="indefinite"/>
            <ellipse cx="303.09" cy="578.71" rx="2.9" ry="4.8" stroke-width="2"/>
      <ellipse cx="303.09" cy="586.84" rx="2.9" ry="4.8" stroke-width="2"/>
      <ellipse cx="303.09" cy="595.22" rx="2.9" ry="4.8" stroke-width="2"/>
      <ellipse cx="303.09" cy="603.86" rx="2.9" ry="4.8" stroke-width="2"/>
      <ellipse cx="303.09" cy="612.75" rx="2.9" ry="4.8" stroke-width="2"/>
      <ellipse cx="303.09" cy="621.89" rx="2.9" ry="4.8" stroke-width="2"/>
      <ellipse cx="303.09" cy="631.29" rx="2.9" ry="4.8" stroke-width="2"/>
      <ellipse cx="303.09" cy="640.94" rx="2.9" ry="4.8" stroke-width="2"/>
      <ellipse cx="303.09" cy="650.84" rx="2.9" ry="4.8" stroke-width="2"/>
      <circle cx="303.09" cy="661.00" r="5.2" stroke-width="2"/>
    </g>

    <!-- 标准字 -->
    <g transform="translate(317,595) scale(0.062500,-0.062500)">
      <path d="M985 0H686V147H682Q579 -25 377 -25Q228 -25 142.5 59.5Q57 144 57 285Q57 583 410 629L688 666Q688 834 506 834Q323 834 158 725V963Q224 997 338.5 1023.0Q453 1049 547 1049Q985 1049 985 612ZM688 416V485L502 461Q348 441 348 322Q348 268 385.5 233.5Q423 199 487 199Q576 199 632.0 260.5Q688 322 688 416Z" transform="translate(0.0,0)"/>
