<Tooltip :title="label" :placement="placement" :mouse-enter-delay="0.12">
  <button
    type="button"
    class="ibtn"
    :class="[`i-${size}`, `t-${tone}`, { solid, round, active }]"
    :aria-label="label"
    :aria-pressed="active ? 'true' : undefined"
    :aria-expanded="expanded === null ? undefined : String(expanded)"
    :disabled="disabled"
    @click="$emit('click', $event)"
  >
    <slot />
  </button>
</Tooltip>
