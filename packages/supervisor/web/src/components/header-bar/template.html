<div class="hd-wrap">
  <header class="hd">
    <BrandLogo class="brand" />

    <OverviewStrip class="hd-ov" :overview="overview" />

    <div class="spacer" />

    <span v-if="connAbnormal" class="achip" :class="{ bad: abnormalBad }">
      <i class="dot" :class="abnormalBad ? 'bad' : 'warn'" />
      <span>{{ abnormalText }}</span>
    </span>

    <!-- 当前宿主：账号胶囊左侧，标明工作进程所属产品族；缺失时不占位。 -->
    <span v-if="hostText" class="hostchip" :title="t('当前宿主')">
      <span class="hlabel">{{ t("宿主") }}</span>
      <span class="hname">{{ hostText }}</span>
    </span>

    <div ref="menuBox" class="acct-menu">
      <button
        type="button"
        class="acctbtn"
        aria-haspopup="menu"
        :aria-label="t('看板操作')"
        :aria-expanded="acctOpen ? 'true' : 'false'"
        @click.stop="acctOpen = !acctOpen"
      >
        <i v-if="paused" class="pdot" aria-hidden="true" />
        <svg class="aico" viewBox="0 0 16 16" aria-hidden="true">
          <circle class="head" cx="8" cy="5.6" r="2.6" fill="none" stroke="currentColor" stroke-width="1.3" />
          <path d="M3.4 13.6c0-2.5 2-4.3 4.6-4.3s4.6 1.8 4.6 4.3" fill="none" stroke="currentColor"
                stroke-width="1.3" stroke-linecap="round" />
        </svg>
      </button>

      <div v-if="acctOpen" class="amenu" role="menu" :aria-label="t('看板操作')">
        <div class="mlabel">{{ t("界面风格") }}</div>
        <div class="themes" role="listbox" :aria-label="t('界面风格')">
          <button
            v-for="s in THEMES"
            :key="s.id"
            type="button"
            class="sopt"
            :class="{ on: s.id === themeId }"
            role="option"
            :aria-selected="s.id === themeId ? 'true' : 'false'"
            @click.stop="pickStyle(s)"
          >
            <!-- 小样取主题自带的 s.sw，不取当前主题令牌，否则四行颜色相同。 -->
            <span class="sw" aria-hidden="true">
              <i v-for="(c, i) in s.sw" :key="i" :style="{ background: c }" />
            </span>
            <span class="snm">{{ lang === "en" ? s.en : s.label }}</span>
            <span v-if="s.id === themeId" class="snote">{{ t("当前") }}</span>
          </button>
        </div>

        <button type="button" class="mopt" role="menuitem" @click.stop="toggleLang">
          <span>{{ t("界面语言") }}</span>
          <span class="mnote">{{ lang === "en" ? "English" : "中文" }}</span>
        </button>

        <div class="msep" aria-hidden="true"></div>
        <div class="mabout" role="group" :aria-label="t('关于')">
          <span class="mabout-id">{{ t("关于") }} · capitalist</span>
          <span class="mabout-meta">
            <span class="mtag" v-if="VERSION">v{{ VERSION }}</span>
            <a
              v-if="REPO_URL"
              class="mlink"
              :href="REPO_URL"
              target="_blank"
              rel="noopener noreferrer"
              :title="t('在 GitHub 上查看源码')"
            >GitHub ↗</a>
          </span>
        </div>
      </div>
    </div>
  </header>
</div>
